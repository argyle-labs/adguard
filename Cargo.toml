[package]
name = "adguard"
version = "0.1.0"
edition = "2021"
description = "AdGuard Home DNS sinkhole — orca service-backend"

[package.metadata.orca]
category = "networking"

[lib]
name = "adguard"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "adguard"
path = "src/main.rs"

# adguard is a BACKEND-ONLY orca plugin: zero #[orca_tool]s. It is a subprocess
# [[bin]] that registers a ServiceBackend and talks to the orca daemon over its
# Unix socket via the serve_service_plugin! macro from plugin-toolkit.
[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", tag = "v0.1.7-rc.1" }

[dev-dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", tag = "v0.1.7-rc.1" }
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints.clippy]
let_underscore_must_use = "deny"
